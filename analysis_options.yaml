# Analyzer and lint configuration for Snooze.
# CI runs `flutter analyze --fatal-infos`, so every issue below fails the build.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Unhandled futures and leaked streams are the bug classes most likely to
    # drop an alarm silently, so they are errors rather than hints.
    unawaited_futures: error
    cancel_subscriptions: error
    close_sinks: error
  exclude:
    - build/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - prefer_final_locals
    - prefer_single_quotes
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_named_constants
